apiVersion: v1
kind: ServiceAccount
metadata:
  name: agones-sdk
  namespace: {{ .Values.global.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agones-sdk
  namespace: {{ .Values.global.namespace }}
subjects:
  - kind: ServiceAccount
    name: agones-sdk
    namespace: {{ .Values.global.namespace }}
roleRef:
  kind: ClusterRole
  name: agones-sdk
  apiGroup: rbac.authorization.k8s.io
