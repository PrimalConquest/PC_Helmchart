apiVersion: autoscaling.agones.dev/v1
kind: FleetAutoscaler
metadata:
  name: {{ .Values.agonesConfig.fleet.name }}-autoscaler
  namespace: {{ .Values.global.namespace }}
spec:
  fleetName: {{ .Values.agonesConfig.fleet.name }}
  policy:
    type: Buffer
    buffer:
      bufferSize: {{ .Values.agonesConfig.autoscaler.bufferSize }}
      minReplicas: {{ .Values.agonesConfig.autoscaler.minReplicas }}
      maxReplicas: {{ .Values.agonesConfig.autoscaler.maxReplicas }}
