# ── Global settings shared across all subcharts ──────────────────────────────
global:
  registry: ad04a       
  imagePullPolicy: Always
  namespace: primal-conquest
  dbWrapperPort: 5000
 

# ── Agones (upstream chart) ───────────────────────────────────────────────────
agones:
  enabled: true
  # Pass-through Values for the upstream agones chart.
  # Full list: https://agones.dev/site/docs/installation/install-agones/helm/
  agones:
    featureGates: ""
  gameservers:
    namespaces:
      - primal-conquest
 
# ── Agones Fleet + Autoscaler ─────────────────────────────────────────────────
agonesConfig:
  fleet:
    name: battle-server-fleet
    replicas: 2
    image:
      repository: primal-conquest-battle-server
      tag: latest
    port:
      name: signalr
      containerPort: 8080
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    health:
      initialDelaySeconds: 120
      periodSeconds: 10
      failureThreshold: 5
  autoscaler:
    bufferSize: 2
    minReplicas: 2
    maxReplicas: 20

# ── Matchmaking service ───────────────────────────────────────────────────────
matchmaking:
  enabled: true
